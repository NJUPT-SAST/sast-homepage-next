name: Release Deploy

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

env:
  IMAGE_NAME: sast/sast-homepage-next
  SERVICE_NAME: sast-homepage-next
  SERVICE_DIR: /home/sast-homepage-next

jobs:
  build-and-deploy:
    name: Build and deploy release image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release source
        uses: actions/checkout@v4

      - name: Validate release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $tag" >&2
            echo "Expected tag format: x.y.z, for example 1.2.3" >&2
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create build and runtime env file
        shell: bash
        env:
          IMAGE_TAG: ${{ steps.release.outputs.tag }}
          APP_PORT: ${{ secrets.APP_PORT }}
          CONTAINER_PORT: ${{ secrets.CONTAINER_PORT }}
          LARK_APP_ID: ${{ secrets.LARK_APP_ID }}
          LARK_APP_SECRET: ${{ secrets.LARK_APP_SECRET }}
        run: |
          set -euo pipefail
          umask 077

          require_secret() {
            key="$1"
            value="$2"
            if [[ -z "$value" ]]; then
              echo "Missing required secret: $key" >&2
              exit 1
            fi
            echo "::add-mask::$value"
          }

          require_secret APP_PORT "$APP_PORT"
          require_secret CONTAINER_PORT "$CONTAINER_PORT"
          require_secret LARK_APP_ID "$LARK_APP_ID"
          require_secret LARK_APP_SECRET "$LARK_APP_SECRET"

          {
            printf 'IMAGE_TAG=%s\n' "$IMAGE_TAG"
            printf 'APP_PORT=%s\n' "$APP_PORT"
            printf 'CONTAINER_PORT=%s\n' "$CONTAINER_PORT"
            printf 'LARK_APP_ID=%s\n' "$LARK_APP_ID"
            printf 'LARK_APP_SECRET=%s\n' "$LARK_APP_SECRET"
          } > .env

      - name: Build release image archive (gzip compressed)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: ${{ env.IMAGE_NAME }}:${{ steps.release.outputs.tag }}
          secret-files: |
            app_env=.env
          outputs: type=docker,dest=./image.tar.gz,compression=gzip

      - name: Show image archive size
        shell: bash
        run: |
          echo "Image archive size:"
          ls -lh image.tar.gz

      - name: Configure SSH
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          require_secret() {
            key="$1"
            value="$2"
            if [[ -z "$value" ]]; then
              echo "Missing required secret: $key" >&2
              exit 1
            fi
            echo "::add-mask::$value"
          }

          require_secret DEPLOY_HOST     "$DEPLOY_HOST"
          require_secret DEPLOY_PORT     "$DEPLOY_PORT"
          require_secret DEPLOY_USER     "$DEPLOY_USER"
          require_secret DEPLOY_SSH_KEY  "$DEPLOY_SSH_KEY"
          require_secret DEPLOY_KNOWN_HOSTS "$DEPLOY_KNOWN_HOSTS"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY"     > ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts

          # Shared SSH settings for all connections in this job.
          # ConnectTimeout / ServerAlive* prevent silent hangs during transfer.
          cat >> ~/.ssh/config <<'SSH_CONFIG'
          Host *
            IdentityFile             ~/.ssh/deploy_key
            UserKnownHostsFile       ~/.ssh/known_hosts
            StrictHostKeyChecking    yes
            BatchMode                yes
            ConnectTimeout           30
            ServerAliveInterval      30
            ServerAliveCountMax      3
          SSH_CONFIG
          chmod 600 ~/.ssh/config

      - name: Transfer release files to server
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          IMAGE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail

          # Bundle env + compose + image into ONE file — one scp, not three.
          cp docker-compose.yml compose.yml
          tar czf deploy-bundle.tar.gz image.tar.gz .env compose.yml

          echo "Deploy bundle size: $(ls -lh deploy-bundle.tar.gz | awk '{print $5}')"

          echo ">>> Connecting to server (ssh -v) …"
          ssh -v -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "mkdir -p '${SERVICE_DIR}/releases' && chmod 700 '${SERVICE_DIR}/releases'"

          echo ">>> Transferring deploy bundle (scp -v) …"
          scp -v -P "$DEPLOY_PORT" \
            deploy-bundle.tar.gz \
            "$DEPLOY_USER@$DEPLOY_HOST:${SERVICE_DIR}/releases/deploy-bundle.tar.gz"

          echo ">>> Transfer complete."

      - name: Remove local sensitive files
        if: always()
        shell: bash
        run: |
          rm -f .env compose.yml image.tar.gz deploy-bundle.tar.gz

      - name: Deploy release on server
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          IMAGE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail

          remote_script=$(cat <<'REMOTE_SCRIPT'
          set -euo pipefail

          SERVICE_DIR="${SERVICE_DIR:?}"
          SERVICE_NAME="${SERVICE_NAME:?}"
          IMAGE_NAME="${IMAGE_NAME:?}"
          IMAGE_TAG="${IMAGE_TAG:?}"

          cd "$SERVICE_DIR"
          mkdir -p releases

          bundle="releases/deploy-bundle.tar.gz"

          if [[ ! -f "$bundle" ]]; then
            echo "ERROR: missing deploy bundle: $bundle" >&2
            exit 1
          fi

          # Unpack into a staging directory so we never clobber running state.
          stage="releases/stage-${IMAGE_TAG}"
          rm -rf "$stage"
          mkdir -p "$stage"

          echo ">>> Unpacking deploy bundle…"
          tar xzf "$bundle" -C "$stage"

          staged_env="$stage/.env"
          staged_compose="$stage/compose.yml"
          staged_image="$stage/image.tar.gz"

          for f in "$staged_env" "$staged_compose" "$staged_image"; do
            if [[ ! -f "$f" ]]; then
              echo "ERROR: missing staged file: $f" >&2
              exit 1
            fi
          done

          chmod 600 "$staged_env"

          echo ">>> Loading Docker image…"
          docker load -i "$staged_image"
          docker image inspect "$IMAGE_NAME:$IMAGE_TAG" >/dev/null
          echo ">>> Image loaded: $IMAGE_NAME:$IMAGE_TAG"

          # Atomically swap in .env and compose file.
          mv -f "$staged_env" .env
          mv -f "$staged_compose" docker-compose.yml
          chmod 600 .env
          chmod 644 docker-compose.yml

          # Cleanup staging and bundle.
          rm -rf "$stage" "$bundle"

          docker compose config --quiet

          echo ">>> Cleaning up old containers for $SERVICE_NAME…"
          old_container_ids="$(
            {
              docker ps -aq --filter "name=^/${SERVICE_NAME}$"
              docker ps -aq --filter "label=com.docker.compose.service=${SERVICE_NAME}"
            } | sort -u
          )"

          if [[ -n "$old_container_ids" ]]; then
            while IFS= read -r container_id; do
              [[ -z "$container_id" ]] && continue
              docker rm -f "$container_id"
            done <<< "$old_container_ids"
          else
            echo ">>> No old containers found."
          fi

          echo ">>> Starting container…"
          docker compose up -d --no-build --remove-orphans

          container_id="$(docker compose ps -q "$SERVICE_NAME")"
          if [[ -z "$container_id" ]]; then
            echo "ERROR: container was not created for service $SERVICE_NAME" >&2
            docker compose ps
            exit 1
          fi

          # Wait up to 150 s for the container to become healthy.
          for attempt in $(seq 1 30); do
            status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}no-healthcheck{{end}}' "$container_id")"
            echo "[$attempt/30] container status: $status"
            if [[ "$status" == "healthy" || "$status" == "no-healthcheck" ]]; then
              break
            fi
            if [[ "$status" == "unhealthy" ]]; then
              echo "ERROR: container became unhealthy" >&2
              docker compose ps
              docker logs --tail 50 "$container_id" || true
              exit 1
            fi
            sleep 5
          done

          final_status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}no-healthcheck{{end}}' "$container_id")"
          if [[ "$final_status" != "healthy" && "$final_status" != "no-healthcheck" ]]; then
            echo "ERROR: timed out waiting for container health (status: $final_status)" >&2
            docker compose ps
            docker logs --tail 50 "$container_id" || true
            exit 1
          fi

          # Quick smoke test against the app port.
          app_port="$(awk -F= '$1 == "APP_PORT" {print substr($0, index($0, "=") + 1)}' .env | tail -n 1)"
          app_port="${app_port:-3000}"

          if command -v curl >/dev/null 2>&1; then
            curl -fsS "http://127.0.0.1:${app_port}/" >/dev/null
          else
            wget -qO- "http://127.0.0.1:${app_port}/" >/dev/null
          fi

          echo ">>> Pruning old $IMAGE_NAME images, keeping the latest 3 tags…"
          mapfile -t old_image_ids < <(
            docker image ls "$IMAGE_NAME" \
              --format '{{.CreatedAt}}\t{{.ID}}\t{{.Repository}}:{{.Tag}}' |
              sort -r |
              awk 'NR > 3 {print $2}' |
              sort -u
          )

          if (( ${#old_image_ids[@]} > 0 )); then
            docker image rm "${old_image_ids[@]}" || true
          else
            echo ">>> No old $IMAGE_NAME images to prune."
          fi

          echo ">>> Deployed $IMAGE_NAME:$IMAGE_TAG"
          REMOTE_SCRIPT
          )

          echo ">>> Running remote deploy script…"
          ssh -v -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "SERVICE_DIR='$SERVICE_DIR' SERVICE_NAME='$SERVICE_NAME' IMAGE_NAME='$IMAGE_NAME' IMAGE_TAG='$IMAGE_TAG' bash -s" <<< "$remote_script"
